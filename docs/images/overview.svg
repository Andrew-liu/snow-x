<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270">
  <defs>
    <style>
      .sans { font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', -apple-system, BlinkMacSystemFont, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    </style>
  </defs>

  <!-- Outer Editorial Sheet -->
  <rect x="1" y="1" width="878" height="268" rx="14" fill="#f4efe4" stroke="#1c1a17" stroke-width="2"/>
  <text x="24" y="27" class="sans" font-size="12" font-weight="700" letter-spacing="0.5" fill="#1c1a17">SNOW-X · 双技能协同工作流</text>
  <text x="856" y="27" text-anchor="end" class="mono" font-size="11" fill="#8a8172">X (TWITTER) CONTENT WORKFLOW</text>
  <line x1="20" y1="38" x2="860" y2="38" stroke="#1c1a17" stroke-width="1.2"/>

  <!-- Left Card: snow-x-boom -->
  <rect x="20" y="52" width="372" height="198" rx="10" fill="#fbf8f1" stroke="#1c1a17" stroke-width="1.5"/>
  <rect x="36" y="66" width="114" height="22" rx="4" fill="#2e4a62"/>
  <text x="93" y="81" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" fill="#fbf8f1">snow-x-boom</text>
  <text x="162" y="82" class="sans" font-size="14" font-weight="700" fill="#1c1a17">中文爆款短帖 · 拆解与生成</text>
  <line x1="36" y1="98" x2="376" y2="98" stroke="#d8cfc0" stroke-width="1"/>

  <rect x="36" y="110" width="26" height="18" rx="3" fill="#b8412c"/>
  <text x="49" y="123" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#fbf8f1">01</text>
  <text x="72" y="123" class="sans" font-size="12.5" fill="#1c1a17">先定唯一指标：浏览 / 收藏 / 回复</text>

  <rect x="36" y="140" width="26" height="18" rx="3" fill="#b8412c"/>
  <text x="49" y="153" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#fbf8f1">02</text>
  <text x="72" y="153" class="sans" font-size="12.5" fill="#1c1a17">8 类帖型 × 10 种钩子 × 5 种收尾</text>

  <rect x="36" y="170" width="26" height="18" rx="3" fill="#b8412c"/>
  <text x="49" y="183" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#fbf8f1">03</text>
  <text x="72" y="183" class="sans" font-size="12.5" fill="#1c1a17">零句号 · Emoji 站位 · 单链接进评论区</text>

  <line x1="36" y1="204" x2="376" y2="204" stroke="#d8cfc0" stroke-width="1"/>
  <text x="36" y="227" class="sans" font-size="11.5" font-weight="600" fill="#2e4a62">样本底座：189 条爆款帖（合计 1.9 亿浏览）· 3 版对照</text>

  <!-- Center Bidirectional Arrows -->
  <text x="440" y="120" text-anchor="middle" class="sans" font-size="11.5" font-weight="700" fill="#b8412c">导流长文</text>
  <line x1="404" y1="130" x2="470" y2="130" stroke="#b8412c" stroke-width="2"/>
  <polygon points="470,125 479,130 470,135" fill="#b8412c"/>

  <line x1="410" y1="168" x2="476" y2="168" stroke="#2e4a62" stroke-width="2"/>
  <polygon points="410,163 401,168 410,173" fill="#2e4a62"/>
  <text x="440" y="186" text-anchor="middle" class="sans" font-size="11.5" font-weight="700" fill="#2e4a62">提炼短推</text>

  <!-- Right Card: snow-x-article -->
  <rect x="488" y="52" width="372" height="198" rx="10" fill="#fbf8f1" stroke="#1c1a17" stroke-width="1.5"/>
  <rect x="504" y="66" width="128" height="22" rx="4" fill="#b8412c"/>
  <text x="568" y="81" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" fill="#fbf8f1">snow-x-article</text>
  <text x="644" y="82" class="sans" font-size="14" font-weight="700" fill="#1c1a17">高收藏深度长文 · 去 AI 味</text>
  <line x1="504" y1="98" x2="844" y2="98" stroke="#d8cfc0" stroke-width="1"/>

  <rect x="504" y="110" width="26" height="18" rx="3" fill="#2e4a62"/>
  <text x="517" y="123" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#fbf8f1">01</text>
  <text x="540" y="123" class="sans" font-size="12.5" fill="#1c1a17">保护 preview_text 黄金预览位 + 动作目录</text>

  <rect x="504" y="140" width="26" height="18" rx="3" fill="#2e4a62"/>
  <text x="517" y="153" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#fbf8f1">02</text>
  <text x="540" y="153" class="sans" font-size="12.5" fill="#1c1a17">提示词 / 清单 / 入口就地交付 + 动作删减</text>

  <rect x="504" y="170" width="26" height="18" rx="3" fill="#2e4a62"/>
  <text x="517" y="183" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#fbf8f1">03</text>
  <text x="540" y="183" class="sans" font-size="12.5" fill="#1c1a17">50 分制去 AI 味审校 + 公开性门禁拦截</text>

  <line x1="504" y1="204" x2="844" y2="204" stroke="#d8cfc0" stroke-width="1"/>
  <text x="504" y="227" class="sans" font-size="11.5" font-weight="600" fill="#b8412c">样本底座：358 篇中文长文 · Hexo Markdown 直出</text>
</svg>
